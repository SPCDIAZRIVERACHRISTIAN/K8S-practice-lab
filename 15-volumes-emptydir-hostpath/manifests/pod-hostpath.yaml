apiVersion: v1
kind: Pod
metadata:
  name: hostpath-pod
  namespace: lab-15-volumes
spec:
  containers:
  - name: writer
    image: busybox:1.36
    command: ["sh", "-c", "echo 'hello from hostPath' > /data/test.txt && cat /data/test.txt && sleep 3600"]
    volumeMounts:
    - name: node-storage
      mountPath: /data
  volumes:
  - name: node-storage
    hostPath:
      path: /tmp/lab-15-hostpath   # directory on the kind node (Docker container)
      type: DirectoryOrCreate
