apiVersion: v1
kind: Pod
metadata:
  name: emptydir-pod
  namespace: lab-15-volumes
spec:
  containers:
  - name: writer
    image: busybox:1.36
    command: ["sh", "-c", "echo 'hello from emptyDir' > /data/test.txt && cat /data/test.txt && sleep 3600"]
    volumeMounts:
    - name: scratch
      mountPath: /data
  volumes:
  - name: scratch
    emptyDir: {}
