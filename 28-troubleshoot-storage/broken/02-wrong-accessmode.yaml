apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-wrong-mode
  namespace: lab-28-storage
spec:
  storageClassName: standard
  accessModes:
  - ReadWriteMany   # kind's local-path provisioner only supports ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
# Problem: kind's local-path StorageClass only supports ReadWriteOnce.
# ReadWriteMany requires a shared filesystem provisioner (NFS, CephFS, etc.).
# The PVC stays Pending because no available PV matches the access mode.
# Fix: change accessModes to [ReadWriteOnce].
