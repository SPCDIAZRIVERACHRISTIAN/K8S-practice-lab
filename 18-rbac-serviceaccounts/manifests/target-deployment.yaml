apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: lab-18-rbac
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
      - name: nginx
        image: nginx:stable
        ports:
        - containerPort: 80
