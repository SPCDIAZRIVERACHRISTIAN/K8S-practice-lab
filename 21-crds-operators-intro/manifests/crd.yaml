apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.lab.example.com
spec:
  group: lab.example.com
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
    shortNames:
    - wgt
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: ["color", "size"]
            properties:
              color:
                type: string
                enum: ["red", "blue", "green"]
                description: "Widget color — must be red, blue, or green"
              size:
                type: integer
                minimum: 1
                maximum: 100
                description: "Widget size — 1 to 100"
              message:
                type: string
                description: "Optional message to display"
          status:
            type: object
            properties:
              phase:
                type: string
              ready:
                type: boolean
    additionalPrinterColumns:
    - name: Color
      type: string
      jsonPath: .spec.color
    - name: Size
      type: integer
      jsonPath: .spec.size
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
