# Intentionally broken: liveness probe checks port 8080 but nginx listens on port 80.
# Symptom: pod starts, then is killed by the liveness probe repeatedly (OOMKilled shows as
# reason=Error with exit code 137, or reason=Killed). kubectl describe shows
# "Liveness probe failed: dial tcp ...8080: connect: connection refused"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-03
  namespace: lab-26-broken
  labels:
    app: app-03
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-03
  template:
    metadata:
      labels:
        app: app-03
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
