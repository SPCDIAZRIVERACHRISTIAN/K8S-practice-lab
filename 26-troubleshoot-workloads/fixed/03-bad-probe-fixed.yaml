apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-03
  namespace: lab-26-broken
  labels:
    app: app-03
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-03
  template:
    metadata:
      labels:
        app: app-03
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
