apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-04
  namespace: lab-26-broken
  labels:
    app: app-04
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-04
  template:
    metadata:
      labels:
        app: app-04
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
