apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-apache
  namespace: lab-14-autoscaling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: php-apache
  template:
    metadata:
      labels:
        app: php-apache
    spec:
      containers:
      - name: php-apache
        image: registry.k8s.io/hpa-example
        ports:
        - containerPort: 80
        # No resources block — HPA cannot calculate utilization without CPU requests
