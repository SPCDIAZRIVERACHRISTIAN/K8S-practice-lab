apiVersion: v1
kind: Pod
metadata:
  name: bad-affinity-pod
  namespace: lab-29-nodes
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - nonexistent-node-xyz    # no node with this hostname exists
  containers:
  - name: nginx
    image: nginx:stable
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
# Problem: required affinity rule requires a node that does not exist.
# The pod stays Pending with: "didn't match Pod's node affinity/selector"
# Fix: change the value to an existing node name (kind-worker or kind-worker2).
