apiVersion: batch/v1
kind: CronJob
metadata:
  name: report-cron
  namespace: lab-13-workloads
spec:
  schedule: "* * * * *"   # every minute
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: reporter
            image: busybox:1.36
            command: ["sh", "-c", "echo 'Report generated at' $(date)"]
