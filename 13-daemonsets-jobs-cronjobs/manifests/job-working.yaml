apiVersion: batch/v1
kind: Job
metadata:
  name: compute-job
  namespace: lab-13-workloads
spec:
  completions: 3
  parallelism: 2
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "echo 'Job task complete on' $(hostname) && sleep 2 && echo 'Exiting successfully'"]
