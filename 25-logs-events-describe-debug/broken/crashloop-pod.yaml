# Intentionally broken: command exits with code 1 after printing an error message.
# This causes Kubernetes to restart the container repeatedly — CrashLoopBackOff.
apiVersion: v1
kind: Pod
metadata:
  name: crashloop-demo
  namespace: lab-25-observe
spec:
  containers:
    - name: crashloop
      image: busybox:stable
      command:
        - sh
        - -c
        - "echo 'Starting up...'; sleep 2; echo 'FATAL: unrecoverable error'; exit 1"
