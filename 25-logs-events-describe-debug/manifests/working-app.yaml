apiVersion: apps/v1
kind: Deployment
metadata:
  name: working-app
  namespace: lab-25-observe
  labels:
    app: working-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: working-app
  template:
    metadata:
      labels:
        app: working-app
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
