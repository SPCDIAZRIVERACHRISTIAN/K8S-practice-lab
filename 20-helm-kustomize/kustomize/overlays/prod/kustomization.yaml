apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lab-20-prod

namePrefix: prod-

resources:
- ../../base

images:
- name: nginx
  newTag: stable

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: webapp

commonLabels:
  env: prod
