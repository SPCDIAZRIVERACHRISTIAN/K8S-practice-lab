apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-broken-selector
  namespace: lab-02-deployments
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx-web   # does not match selector — Kubernetes will reject this
    spec:
      containers:
      - name: nginx
        image: nginx:stable
        ports:
        - containerPort: 80
