apiVersion: v1
kind: Pod
metadata:
  name: pod-oom
  namespace: lab-11-resources
spec:
  containers:
  - name: memory-eater
    image: busybox:1.36
    command: ["sh", "-c", "dd if=/dev/zero of=/dev/shm/fill bs=1M count=20 && echo done && sleep 3600"]
    resources:
      requests:
        memory: "10Mi"
      limits:
        memory: "15Mi"   # container will try to write 20Mi to /dev/shm — exceeds limit
