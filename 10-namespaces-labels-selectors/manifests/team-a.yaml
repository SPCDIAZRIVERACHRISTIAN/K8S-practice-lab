apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: lab-10-team-a
  labels:
    team: a
    tier: frontend
  annotations:
    contact: "team-a@example.com"
    version: "2.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      team: a
  template:
    metadata:
      labels:
        app: frontend
        team: a
        tier: frontend
        env: production
    spec:
      containers:
      - name: nginx
        image: nginx:stable
        ports:
        - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lab-10-team-a
  labels:
    team: a
    tier: backend
  annotations:
    contact: "team-a@example.com"
    version: "1.4.2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
      team: a
  template:
    metadata:
      labels:
        app: backend
        team: a
        tier: backend
        env: production
    spec:
      containers:
      - name: nginx
        image: nginx:stable
        ports:
        - containerPort: 80
